name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node.js ${{ matrix.node-version || 'from .node-version' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # An empty value reads .node-version. 22 is the oldest major that package.json engines allows.
        node-version: ['', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ !matrix.node-version && '.node-version' || '' }}
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint typecheck build test test-integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Stryker workers each e2e run may start; the suite requires it.
      LZ_E2E_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t e2e

  mutation:
    name: Mutation testing (${{ matrix.project }}:mutate-${{ matrix.config }})
    runs-on: ubuntu-latest
    # Sized for a full run, which main does on every push.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # `slug` names the report artifact, as an artifact name cannot hold the slash of a project name. `mutated`
        # lists, as exclusions, the files the config mutates. Stryker's incremental mode sees changes to those and to
        # the test files; every other input goes into the cache key below.
        include:
          - project: '@lz-node-test/eslint-rules'
            slug: eslint-rules
            root: tools/eslint-rules
            config: src
            mutated: '!tools/eslint-rules/*.ts'
            timeout: 30
          - project: '@lz-node-test/eslint-rules'
            slug: eslint-rules
            root: tools/eslint-rules
            config: test-code
            mutated: '!tools/eslint-rules/*.test.ts'
            timeout: 30
          - project: '@layzee/node-test-extensions'
            slug: node-test-extensions
            root: packages/node-test-extensions
            config: src
            mutated: '!packages/node-test-extensions/src/**'
            timeout: 30
          - project: '@layzee/node-test-extensions'
            slug: node-test-extensions
            root: packages/node-test-extensions
            config: test-code
            mutated: '!packages/node-test-extensions/test/**/*.test.ts'
            timeout: 30
          - project: '@layzee/stryker-node-test-mutators'
            slug: stryker-node-test-mutators
            root: packages/stryker-node-test-mutators
            config: src
            mutated: "!packages/stryker-node-test-mutators/src/**\n!packages/stryker-node-test-mutators/test/synthetic/node-apis.ts"
            timeout: 45
          - project: '@layzee/stryker-node-test-mutators'
            slug: stryker-node-test-mutators
            root: packages/stryker-node-test-mutators
            config: test-code
            mutated: '!packages/stryker-node-test-mutators/test/**/*.test.ts'
            timeout: 30
          - project: '@layzee/stryker-node-test-runner'
            slug: stryker-node-test-runner
            root: packages/stryker-node-test-runner
            config: src
            mutated: '!packages/stryker-node-test-runner/src/**'
            timeout: 180
          - project: '@layzee/stryker-node-test-runner'
            slug: stryker-node-test-runner
            root: packages/stryker-node-test-runner
            config: test-code
            mutated: '!packages/stryker-node-test-runner/test/**/*.test.ts'
            timeout: 30
    env:
      INCREMENTAL_FILE: reports/stryker-incremental/${{ matrix.project }}.${{ matrix.config }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Every config loads the runner and the operators from source, so their source is an outside input unless the
      # config mutates it. A change to any outside input misses the cache and runs the config in full.
      - name: Key the incremental file
        id: key
        run: >-
          echo "prefix=stryker-inc-${{ matrix.project }}.${{ matrix.config }}-${{ runner.os }}-node-${{
          steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'stryker.base.mjs',
          'tsconfig.base.json', 'packages/node-test-extensions/package.json', 'packages/node-test-extensions/src/**',
          'packages/stryker-node-test-mutators/package.json', 'packages/stryker-node-test-runner/package.json',
          'packages/stryker-node-test-mutators/src/**', 'packages/stryker-node-test-runner/src/**',
          format('{0}/**', matrix.root), format('!{0}/**/*.test.ts', matrix.root), '!**/*.md', '!**/dist/**',
          '!**/out-tsc/**', matrix.mutated) }}-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      # Main runs every mutant and saves the baseline, so a reused result never outlives a push to main: an
      # incremental run can reuse a static mutant's Survived result after a test that kills it was added.
      - run: >-
          npx nx run ${{ matrix.project }}:mutate-${{ matrix.config }} --incremental
          ${{ github.event_name == 'push' && '--force' || '' }}
      # Also when the run fails its threshold: the job summary shows the score and the mutants per status.
      - name: Summarize the mutation score
        if: always()
        env:
          REPORT: reports/mutation/${{ matrix.project }}.${{ matrix.config }}.json
          TITLE: ${{ matrix.project }}:mutate-${{ matrix.config }}
        run: |
          if [ ! -f "$REPORT" ]; then
            echo "::warning::Stryker wrote no $REPORT, so the job summary has no mutation score for $TITLE."
            echo "Stryker wrote no mutation report for $TITLE." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node tools/eslint-rules/mutation-summary.cli.ts "$REPORT" "$TITLE" >> "$GITHUB_STEP_SUMMARY"
      # Also after a failure or a timeout: Stryker saves the results it has when it is interrupted.
      - if: always() && steps.key.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}
      # Most needed when the run fails: the report shows each surviving mutant and each RuntimeError.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.slug }}.${{ matrix.config }}
          path: reports/mutation/${{ matrix.project }}.${{ matrix.config }}.html
