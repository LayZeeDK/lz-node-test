name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run of the one before; main finishes every run, as each saves the
# baseline of the mutation caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }}, Node.js ${{ matrix.node-version || 'from .node-version' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # An empty value reads .node-version. 22 is the oldest major that package.json engines allows.
        node-version: ['', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ !matrix.node-version && '.node-version' || '' }}
          cache: npm
      - run: npm ci
      # Formatting does not vary by OS or Node.js version.
      - if: matrix.os == 'ubuntu-latest' && !matrix.node-version
        run: npx prettier --check .
      - run: npx nx run-many -t lint typecheck build test test-integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Stryker workers each e2e run may start; the suite requires it.
      LZ_E2E_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t e2e

  mutation:
    name: Mutation testing (${{ matrix.project }}:mutate-${{ matrix.config }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    # Sized for a full run, which main does on every push.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # `slug` names the report artifact, as an artifact name cannot hold the slash of a project name. `mutated`
        # lists, as exclusions, the files the config mutates. Stryker's incremental mode sees changes to those and to
        # the test files; every other input goes into the cache key below. A `shard` mutates only the files its
        # `mutate` names, and its last shard takes the rest, so a new file lands in it.
        include:
          - project: '@layzee/eslint-rules'
            slug: eslint-rules
            root: tools/eslint-rules
            config: src
            mutated: '!tools/eslint-rules/*.ts'
            timeout: 30
          - project: '@layzee/eslint-rules'
            slug: eslint-rules
            root: tools/eslint-rules
            config: test-code
            mutated: '!tools/eslint-rules/*.test.ts'
            timeout: 30
          - project: '@layzee/node-test-extensions'
            slug: node-test-extensions
            root: packages/node-test-extensions
            config: src
            mutated: '!packages/node-test-extensions/src/**/*.ts'
            timeout: 30
          - project: '@layzee/node-test-extensions'
            slug: node-test-extensions
            root: packages/node-test-extensions
            config: test-code
            mutated: '!packages/node-test-extensions/test/**/*.test.ts'
            timeout: 30
          - project: '@layzee/stryker-mutator-core'
            slug: stryker-mutator-core
            root: packages/stryker-mutator-core
            config: src
            mutated: '!packages/stryker-mutator-core/src/**/*.ts'
            timeout: 30
          - project: '@layzee/stryker-mutator-core'
            slug: stryker-mutator-core
            root: packages/stryker-mutator-core
            config: test-code
            mutated: '!packages/stryker-mutator-core/test/**/*.test.ts'
            timeout: 30
          - project: '@layzee/stryker-node-mutators'
            slug: stryker-node-mutators
            root: packages/stryker-node-mutators
            config: src
            mutated: "!packages/stryker-node-mutators/src/**/*.ts\n!packages/stryker-node-mutators/test/synthetic/node-apis.ts"
            timeout: 45
          - project: '@layzee/stryker-node-mutators'
            slug: stryker-node-mutators
            root: packages/stryker-node-mutators
            config: test-code
            mutated: '!packages/stryker-node-mutators/test/**/*.test.ts'
            timeout: 30
          - project: '@layzee/stryker-node-test-mutators'
            slug: stryker-node-test-mutators
            root: packages/stryker-node-test-mutators
            config: src
            mutated: '!packages/stryker-node-test-mutators/src/**/*.ts'
            timeout: 30
          - project: '@layzee/stryker-node-test-mutators'
            slug: stryker-node-test-mutators
            root: packages/stryker-node-test-mutators
            config: test-code
            mutated: '!packages/stryker-node-test-mutators/test/**/*.test.ts'
            timeout: 30
          - project: '@layzee/stryker-node-test-runner'
            slug: stryker-node-test-runner
            root: packages/stryker-node-test-runner
            config: src
            shard: a
            mutate: packages/stryker-node-test-runner/src/runner.ts,packages/stryker-node-test-runner/src/wrap.ts
            mutated: '!packages/stryker-node-test-runner/src/**/*.ts'
            timeout: 90
          - project: '@layzee/stryker-node-test-runner'
            slug: stryker-node-test-runner
            root: packages/stryker-node-test-runner
            config: src
            shard: b
            mutate: packages/stryker-node-test-runner/src/hook-core.ts,packages/stryker-node-test-runner/src/record.ts
            mutated: '!packages/stryker-node-test-runner/src/**/*.ts'
            timeout: 90
          - project: '@layzee/stryker-node-test-runner'
            slug: stryker-node-test-runner
            root: packages/stryker-node-test-runner
            config: src
            shard: c
            mutate: "packages/stryker-node-test-runner/src/**/*.ts,!packages/stryker-node-test-runner/src/runner.ts,\
              !packages/stryker-node-test-runner/src/wrap.ts,!packages/stryker-node-test-runner/src/hook-core.ts,\
              !packages/stryker-node-test-runner/src/record.ts"
            mutated: '!packages/stryker-node-test-runner/src/**/*.ts'
            timeout: 90
          - project: '@layzee/stryker-node-test-runner'
            slug: stryker-node-test-runner
            root: packages/stryker-node-test-runner
            config: test-code
            mutated: '!packages/stryker-node-test-runner/test/**/*.test.ts'
            timeout: 30
          - project: e2e
            slug: e2e
            root: e2e
            config: src
            mutated: '!e2e/src/**/*.ts'
            timeout: 60
          - project: e2e
            slug: e2e
            root: e2e
            config: test-code
            mutated: '!e2e/test/unit/*.test.ts'
            timeout: 30
    env:
      RUN: ${{ matrix.project }}.${{ matrix.config }}${{ matrix.shard && format('.{0}', matrix.shard) || '' }}
      INCREMENTAL_FILE: reports/stryker-incremental/${{ matrix.project }}.${{ matrix.config }}${{ matrix.shard &&
        format('.{0}', matrix.shard) || '' }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Every config loads the runner and the operators from source, so their source is an outside input unless the
      # config mutates it; the eslint-rules tests also read every Stryker and ESLint config and the synthetic test
      # files, which ESLint ignores. A change to any outside input misses the cache and runs the config in full.
      - name: Key the incremental file
        id: key
        run: >-
          echo "prefix=stryker-inc-${{ env.RUN }}-${{ runner.os }}-node-${{
          steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'stryker.base.mjs',
          'tsconfig.base.json', 'packages/*/package.json', 'packages/*/src/**', 'packages/*/test/synthetic/**',
          'packages/*/stryker*.config.mjs', 'e2e/stryker*.config.mjs', 'eslint.config.mjs',
          'packages/*/eslint.config.mjs', '.github/workflows/ci.yml', format('{0}/**', matrix.root),
          format('!{0}/**/*.test.ts', matrix.root), '!**/*.md', '!**/dist/**', '!**/out-tsc/**', matrix.mutated)
          }}-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      # Main runs every mutant and saves the baseline, so a reused result never outlives a push to main: an
      # incremental run can reuse a static mutant's Survived result after a test that kills it was added.
      - run: >-
          npx nx run ${{ matrix.project }}:mutate-${{ matrix.config }} --incremental
          ${{ github.event_name == 'push' && '--force' || '' }} --incrementalFile="$INCREMENTAL_FILE"
          ${MUTATE:+--mutate="$MUTATE"}
        env:
          MUTATE: ${{ matrix.mutate }}
      # Also when the run fails its threshold: the job summary shows the score and the mutants per status.
      - name: Summarize the mutation score
        if: always()
        env:
          REPORT: reports/mutation/${{ matrix.project }}.${{ matrix.config }}.json
          TITLE: ${{ env.RUN }}
        run: |
          if [ ! -f "$REPORT" ]; then
            echo "::warning::Stryker wrote no $REPORT, so the job summary has no mutation score for $TITLE."
            echo "Stryker wrote no mutation report for $TITLE." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node tools/eslint-rules/mutation-summary.cli.ts "$REPORT" "$TITLE" >> "$GITHUB_STEP_SUMMARY"
      # Also after a failure or a timeout: Stryker saves the results it has when it is interrupted.
      - if: always() && steps.key.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}
      # Most needed when the run fails: the report shows each surviving mutant and each RuntimeError.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.slug }}.${{ matrix.config }}${{ matrix.shard && format('.{0}', matrix.shard) || '' }}
          path: reports/mutation/${{ matrix.project }}.${{ matrix.config }}.html
