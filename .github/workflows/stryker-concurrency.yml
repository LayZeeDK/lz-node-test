name: Stryker concurrency

# The concurrency the Stryker configs pick on each hosted runner. It reads the machine at config load, so a change to
# stryker.base.mjs can only be checked on the runners themselves. Kept out of ci.yml, which every mutation cache key
# hashes.
on:
  push:
    branches: [main]
    paths: [stryker.base.mjs, .node-version, .github/workflows/stryker-concurrency.yml]
  pull_request:
    paths: [stryker.base.mjs, .node-version, .github/workflows/stryker-concurrency.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # stryker.base.mjs imports only node:os, so the probe needs no npm ci.
      - shell: bash
        run: |
          node --input-type=module <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import { availableParallelism, freemem, totalmem } from 'node:os';
          import base, { concurrency, gbPerUnitWithChildProcesses } from './stryker.base.mjs';

          const gb = (bytes) => (bytes / 2 ** 30).toFixed(1);
          const rows = [
            ['Cores', availableParallelism()],
            ['Total GB', gb(totalmem())],
            ['Available GB', gb(process.availableMemory())],
            ['Free GB', gb(freemem())],
            ['Concurrency, base config', base.concurrency],
            ['Concurrency, e2e configs', concurrency(gbPerUnitWithChildProcesses)],
          ];

          console.log(`### ${process.env.RUNNER_OS} ${process.env.RUNNER_ARCH}, Node.js ${process.version}\n`);
          console.log('| | |\n|---|---|');
          rows.forEach(([name, value]) => console.log(`| ${name} | ${value} |`));
          EOF
